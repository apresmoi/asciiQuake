<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glyph lab — asciiQuake</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: #0b0b0d; color: #cfcfd4;
        font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
        display: flex; height: 100vh; overflow: hidden;
      }
      #controls {
        width: 300px; flex: 0 0 300px; overflow-y: auto; padding: 10px 12px;
        background: #111114; border-right: 1px solid #26262c;
      }
      #controls h1 { font-size: 13px; margin: 0 0 8px; color: #e8b45a; }
      #controls h2 {
        font-size: 11px; margin: 14px 0 4px; color: #8f8fa0;
        text-transform: uppercase; letter-spacing: 0.08em;
      }
      .knob { display: grid; grid-template-columns: 1fr 52px; gap: 4px; align-items: center; margin: 2px 0; }
      .knob label { grid-column: 1 / -1; color: #a8a8b4; margin-top: 4px; }
      .knob input[type="range"] { width: 100%; }
      .knob output { text-align: right; color: #e8e8ee; }
      select, input[type="text"], textarea, button {
        width: 100%; background: #1a1a20; color: #e8e8ee; border: 1px solid #33333c;
        border-radius: 3px; padding: 4px 6px; font: inherit;
      }
      textarea { resize: vertical; min-height: 44px; }
      button { cursor: pointer; margin-top: 6px; }
      button:hover { border-color: #e8b45a; }
      #copy-out { margin-top: 4px; word-break: break-all; color: #7fbf7f; font-size: 10px; }
      #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      #stage { flex: 1; display: flex; gap: 8px; padding: 8px; min-height: 0; }
      .pane {
        flex: 1; display: flex; flex-direction: column; min-width: 0;
        border: 1px solid #26262c; border-radius: 4px; overflow: hidden;
      }
      .pane-title { padding: 3px 8px; background: #16161a; color: #8f8fa0; font-size: 11px; }
      .pane-body { flex: 1; position: relative; background: #000; overflow: hidden; }
      #src-host, #glyph-host { position: absolute; inset: 0; }
      #glyph-host { overflow: hidden; }
      #src-content { position: absolute; }
      #src-content img, #src-content canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      #readouts {
        flex: 0 0 auto; max-height: 40vh; overflow: auto; padding: 8px 12px;
        border-top: 1px solid #26262c; background: #101013; display: flex; gap: 18px;
      }
      #readout-main { flex: 1; min-width: 0; }
      #readouts table { border-collapse: collapse; margin-top: 4px; }
      #readouts th, #readouts td { padding: 1px 10px 1px 0; text-align: right; color: #cfcfd4; }
      #readouts th { color: #8f8fa0; font-weight: normal; }
      #readouts td:first-child, #readouts th:first-child { text-align: left; }
      .warn { color: #ff6b57; font-weight: bold; }
      .ok { color: #7fbf7f; }
      #keyfacts { margin: 0 0 2px; }
      #keyfacts b { color: #e8b45a; font-weight: normal; }
      #loupe-wrap { flex: 0 0 auto; }
      #loupe {
        width: 300px; height: 220px; overflow: hidden; position: relative;
        border: 1px solid #33333c; background: #000; cursor: crosshair;
      }
      #loupe-inner { position: absolute; transform-origin: 0 0; }
      #loupe-note { color: #6f6f7c; font-size: 10px; width: 300px; margin-top: 2px; }
      #drop-hint {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(232, 180, 90, 0.15); color: #e8b45a; font-size: 14px; pointer-events: none;
      }
      body.dragging #drop-hint { display: flex; }
    </style>
  </head>
  <body>
    <div id="controls"></div>
    <div id="main">
      <div id="stage">
        <div class="pane">
          <div class="pane-title">source (HTML, ground truth)</div>
          <div class="pane-body"><div id="src-host"><div id="src-content"></div></div></div>
        </div>
        <div class="pane">
          <div class="pane-title">glyph render (game pipeline — hover for loupe)</div>
          <div class="pane-body"><div id="glyph-host"></div></div>
        </div>
      </div>
      <div id="readouts">
        <div id="readout-main"></div>
        <div id="loupe-wrap">
          <div id="loupe"><div id="loupe-inner"></div></div>
          <div id="loupe-note">structure loupe ×6 — re-rendered DOM, shows what the grid CONTAINS,
            not what your screen pixels resolve. The unscaled pane is the ground truth.</div>
        </div>
      </div>
    </div>
    <div id="drop-hint">drop an image to test it</div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
