name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Quake data is not in the repo; prepare downloads and verifies the
      # shareware archive. Same secret the Netlify/R2 deploy uses.
      QUAKE_SHAREWARE_URL: ${{ secrets.QUAKE_SHAREWARE_URL }}
      QUAKE_RENDER_BUNDLE_AVIF_EFFORT: "0"
      # Unset on purpose: assets ship INSIDE the Pages artifact, so the runtime
      # default of /q is correct. (The R2 deploy overrides this with a versioned
      # bucket path; Pages has no equivalent, see the cache note in the README.)
    steps:
      - uses: actions/checkout@v4
        with:
          # vite derives the version label from the commit count.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check build inputs
        run: test -n "$QUAKE_SHAREWARE_URL"

      - run: pnpm install --frozen-lockfile

      - name: Restore prepared Quake assets
        # Preparing the assets is ~10.5 of a ~12 minute deploy; everything else
        # (build, artifact upload, publish) is well under a minute. The output is a
        # pure function of the checksum-pinned shareware archive and the inputs in
        # the key below, so an unchanged key means byte-identical assets.
        id: quake-assets
        uses: actions/cache@v4
        with:
          path: build/generated
          # Every repo input prepare actually reads: the generators (which pin the
          # shareware archive's SHA-256), the source images it derives HUD/menu/
          # social art from, robots.txt + sitemap.xml (copied into the asset tree),
          # the QuakeC program facts, and the lockfile (polycss's version changes
          # the render bundles). NO restore-keys on purpose — a near-miss would
          # restore assets built by different generators and ship them silently.
          key: quake-assets-v1-${{ hashFiles('src/prepare/**', 'src/assets/**', 'src/site/**', 'src/generated/quakeProgramFacts.json', 'pnpm-lock.yaml') }}

      - name: Generate Quake assets
        if: steps.quake-assets.outputs.cache-hit != 'true'
        run: pnpm prepare:quake

      - name: Verify prepared assets
        # Runs on both paths, so a truncated or partial cache restore fails here
        # instead of publishing a site with missing maps.
        run: pnpm test:asset-state

      - name: Build site
        run: pnpm build

      - name: Pin the custom domain
        # Keeps asciiquake.wtf attached across deploys; the artifact replaces the
        # published tree wholesale, so a CNAME written only in repo settings can
        # otherwise be dropped.
        run: echo "asciiquake.wtf" > dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
