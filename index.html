    <script>
      // Decide the render backend BEFORE first paint. The ASCII overlay draws all
      // menu art itself, and the CSS that stops the HTML art painting keys off
      // this class — setting it later (once the app boots) leaves a window where
      // the PNGs paint first, seen as the backdrop flashing on every page open.
      // Mirrors resolveQuakeRenderMode(): URL wins, then the stored preference,
      // then the default (glyphcss).
      (function () {
        try {
          var fromUrl = new URLSearchParams(window.location.search).get("renderMode");
          var stored = null;
          try { stored = window.localStorage.getItem("cssquake.renderMode"); } catch (e) {}
          var mode = fromUrl || stored || "glyphcss";
          if (mode === "glyphcss") document.documentElement.classList.add("quake-glyph-render");
        } catch (e) {}
      })();
    </script>

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;

      #quake-app {
        position: fixed;
        inset: 0;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #050505;
        isolation: isolate;

        position: absolute;
        inset: 0;
      }

      #quake-interface,

        pointer-events: none;
      }

      /* Glyph world, weapon, and UI scene mounts. */
      #quake-scene,
      #quake-weapon,
      #quake-hud {
        position: absolute;
        inset: 0;
      }

      #quake-scene {
        z-index: 1;
      }

      #quake-scene > .quake-camera-host {
        position: absolute;
        inset: 0;
        outline: none;
        touch-action: none;
      }

      #quake-weapon {
        z-index: 2;
      }

      #quake-multiplayer-controls {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Native multiplayer controls are mounted only while their screen is
         visible. */
      .quake-mp-control {
        display: none;
        box-sizing: border-box;
        border: 2px solid rgba(216, 137, 63, 0.62);
        border-radius: 0;
        background: rgba(0, 0, 0, 0.62);
        color: #f6f1df;
        font-family: ui-monospace, "SFMono-Regular", "Roboto Mono", Menlo, Consolas, monospace;
        letter-spacing: 0;
        padding: 0 5px;
        outline: none;
        pointer-events: auto;
      }
      .quake-mp-control:focus {
        border-color: #ffd089;
        box-shadow: 0 0 0 2px rgba(240, 173, 92, 0.2);

      #quake-multiplayer-color {
        padding: 0;
        cursor: pointer;

      .quake-mp-control option {
        color: #f6f1df;
        background: #050403;
      }
